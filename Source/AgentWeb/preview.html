<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevC++ AI · 界面原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111215;color:#e4e7ec;font:14px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif}button,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #5b9cf6;outline-offset:2px}.bench{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333}.bench label{display:flex;gap:6px;align-items:center}.bench small{color:#a0a7b2}.bench select,.bench button{background:#25272b;color:#e4e7ec;border:1px solid #424650;padding:4px 8px;border-radius:5px}.workspace{padding:24px;display:flex;justify-content:center}.app{--bg:#1e1f22;--surface:#25272b;--hover:#2d3035;--border:#3a3d43;--text:#e4e7ec;--muted:#a0a7b2;--accent:#80b5ff;width:480px;max-width:100%;height:780px;max-height:calc(100vh - 116px);min-height:400px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;overflow:hidden}.app.light{--bg:#fafafa;--surface:#f0f2f5;--hover:#e4e8ee;--border:#cbd1d9;--text:#242830;--muted:#56606e;--accent:#175eb6}.nav{height:48px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}.title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}.icon,.quiet{background:transparent;color:var(--muted);border:0;border-radius:5px;padding:5px 8px}.icon:hover,.quiet:hover{background:var(--hover);color:var(--text)}.icon{min-width:30px;font-size:18px}.reader{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-color:var(--border) transparent;scrollbar-width:thin}.messages{padding:24px 20px;max-width:800px;margin:auto}.user{max-width:80%;width:fit-content;margin:0 0 24px auto;padding:10px 14px;border-radius:12px 12px 3px 12px;background:var(--hover)}.identity{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-weight:600}.avatar{border:1px solid var(--border);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:11px;color:var(--accent)}p{margin:0 0 12px}h3{font-size:17px;margin:22px 0 10px}ol,ul{padding-left:22px;margin:8px 0 16px}li{margin:5px 0}code,pre{font-family:Consolas,monospace}p code,li code{background:var(--hover);padding:2px 5px;border-radius:4px;font-size:13px}.codebox{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:14px 0}.codehead{display:flex;gap:4px;align-items:center;padding:5px 10px;background:var(--surface);font-size:12px;color:var(--muted)}.codehead span{flex:1}pre{margin:0;padding:14px;overflow:auto;font-size:13px;line-height:1.7;background:var(--surface)}.kw{color:var(--accent)}.comment{color:#8cb878}.tablewrap{overflow:auto;margin:12px 0 16px}table{border-collapse:collapse;min-width:340px;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--border);padding:9px 12px}th{background:var(--surface)}blockquote{margin:14px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--muted)}details.tool{margin:8px 0;font-size:13px}summary{cursor:pointer;padding:6px 8px;border-radius:5px;color:var(--muted)}summary:hover{background:var(--hover)}.status{float:right;color:var(--muted)}.toolbody{border:1px solid var(--border);border-radius:7px;padding:12px;margin:5px 0 12px}.toolbody label{display:block;color:var(--muted);margin-bottom:6px;font-size:12px}.toolbody pre{border-radius:5px;max-height:180px;margin-bottom:10px}.composer{margin:8px 16px 0;border:1px solid var(--border);border-radius:9px;background:var(--surface);flex-shrink:0}.composer:focus-within{border-color:var(--accent)}.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 10px 0}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:5px;font-size:12px;padding:2px 6px;color:var(--muted)}.chip button{border:0;background:none;color:inherit}textarea{display:block;width:100%;resize:none;background:transparent;border:0;outline:none;color:var(--text);padding:12px 14px;height:74px;max-height:180px;line-height:1.6}textarea::placeholder{color:var(--muted)}.inputtools{display:flex;gap:3px;align-items:center;padding:5px 8px 8px}.inputtools select{min-width:0;max-width:135px;background:transparent;color:var(--muted);border:0;font-size:12px}.send{margin-left:auto;background:#377bd3;border:0;border-radius:6px;color:#fff;width:30px;height:30px}.footer{padding:6px 20px 12px;font-size:11px;color:var(--muted)}.approval,.error{padding:14px;border:1px solid var(--border);border-radius:8px;margin:16px 0}.approval h3,.error h3{margin:0 0 8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.primary{background:#377bd3;color:#fff;border:0;padding:6px 12px;border-radius:5px}.error{border-color:#b96957}.empty{padding:40px 4px}.empty h3{font-size:22px}.suggestions{display:grid;gap:8px;margin-top:24px}.suggestions button{text-align:left;border:1px solid var(--border);padding:10px 12px;border-radius:7px;color:var(--text);background:transparent}.jump{position:sticky;bottom:12px;display:block;margin:0 16px 12px auto;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:18px;padding:5px 12px}.hidden{display:none!important}.menu{position:absolute;right:12px;top:45px;z-index:3;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:0 6px 24px #0005}.menu button{display:block;width:100%;text-align:left}.app{position:relative}.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:var(--hover);border:1px solid var(--border);border-radius:6px;padding:8px 14px;z-index:5;white-space:nowrap}
</style>
<div class="bench"><strong>AI 面板设计预览</strong><label>宽度<select id="width"><option>320</option><option selected>480</option><option>800</option></select></label><label>状态<select id="state"><option value="chat">正常对话</option><option value="markdown">代码与表格</option><option value="tools">工具展开</option><option value="approval">命令审批</option><option value="empty">空会话</option><option value="error">错误恢复</option></select></label><button id="theme">切换深浅主题</button><small>交互原型 · 使用示例数据，未连接模型</small></div>
<main class="workspace"><section class="app" id="app"><header class="nav"><button class="icon" title="会话历史" aria-label="会话历史" id="history">‹</button><div class="title">检查哈希表实现</div><button class="icon" title="新会话" aria-label="新会话" id="new">＋</button><button class="icon" title="更多" aria-label="更多" id="more">⋯</button></header><div id="menu" class="menu hidden"><button class="quiet" data-notice="设置入口：正式版本将打开模型配置">设置</button><button class="quiet" data-notice="诊断日志：正式版本将展示请求和错误记录">诊断日志</button><button class="quiet" data-notice="清空显示不会重置模型上下文，请使用新会话">清空显示说明</button></div><div class="reader" id="reader"><article class="messages" id="messages"></article><button class="jump hidden" id="jump">↓ 回到最新消息</button></div><div class="composer"><div class="chips" id="chips"><span class="chip">main.cpp · 选中 18 行<button aria-label="移除 main.cpp 上下文" id="remove">×</button></span></div><textarea id="input" aria-label="输入消息" placeholder="描述问题，或输入 / 选择操作……"></textarea><div class="inputtools"><button class="icon" aria-label="添加附件" id="attach">＋</button><select aria-label="审批模式"><option>普通审批</option></select><select aria-label="模型"><option>V4 Flash</option><option>V4 Pro</option></select><button class="send" id="send" aria-label="发送">↑</button></div></div><div class="footer">当前项目 · DevCPlusAi</div><div class="toast hidden" id="toast" role="status"></div></section></main>
<template id="answer"><div class="user">检查这个函数，并说明如何修改。</div><div class="identity"><span class="avatar">AI</span>AI 助手</div><p>这段实现可以正常查找元素，但删除节点时需要注意<strong>链表头节点</strong>与<strong>内存释放</strong>。</p><details class="tool"><summary>读取 main.cpp <span class="status">完成 ✓</span></summary><div class="toolbody"><label>输入</label><pre>main.cpp · 第 180–220 行</pre><label>输出</label><pre>已读取 contains 和 erase 函数。</pre></div></details><details class="tool"><summary>检查编译结果 <span class="status">完成 ✓</span></summary><div class="toolbody"><label>命令</label><pre>g++ -Wall -Wextra main.cpp</pre><label>输出</label><pre>编译成功，未发现警告。</pre></div></details><h3>建议的修改</h3><ol><li>先判断桶是否为空。</li><li>删除节点后更新前驱指针，并释放节点内存。</li></ol><div class="codebox"><div class="codehead"><span>C++</span><button class="quiet" data-copy>复制</button><button class="quiet" data-notice="正式版本将在 IDE 中打开此代码块">在编辑器打开</button></div><pre><code><span class="kw">bool</span> contains(<span class="kw">const</span> K&amp; key) <span class="kw">const</span> {
    <span class="comment">// 复用已有的查找逻辑</span>
    <span class="kw">return</span> find(key) != <span class="kw">nullptr</span>;
}</code></pre></div><p>平均情况下，查找的时间复杂度为 <code>O(1)</code>。冲突较多时，需要沿链表继续查找。</p><div class="tablewrap"><table><thead><tr><th>操作</th><th>平均复杂度</th><th>最坏复杂度</th></tr></thead><tbody><tr><td>查找</td><td>O(1)</td><td>O(n)</td></tr><tr><td>删除</td><td>O(1)</td><td>O(n)</td></tr></tbody></table></div><blockquote>建议为“删除头节点”和“删除不存在的键”分别保留测试用例。</blockquote><button class="quiet" data-copy-answer>复制回复</button></template>
<script>
const $=s=>document.querySelector(s);let toastTimer;const notify=t=>{clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2400)};
function render(){let state=$('#state').value;$('#messages').innerHTML='';if(state==='empty'){$('#messages').innerHTML='<div class="empty"><div class="identity"><span class="avatar">AI</span>AI 助手</div><h3>一起完成下一段代码</h3><p>可以解释选中的代码、排查编译错误，或描述你要实现的功能。</p><div class="suggestions"><button>解释选中的代码</button><button>检查潜在问题</button><button>分析最近的编译错误</button></div></div>';}else{$('#messages').append($('#answer').content.cloneNode(true));if(state==='tools')document.querySelectorAll('details.tool').forEach(x=>x.open=true);if(state==='approval'){$('#messages').innerHTML='<div class="user">帮我运行编译检查。</div><div class="identity"><span class="avatar">AI</span>AI 助手</div><p>需要你的批准后才能执行以下命令。</p><div class="approval"><h3>允许执行编译命令？</h3><p>工作目录：DevCPlusAi</p><pre>g++ -Wall -Wextra main.cpp</pre><div class="actions"><button class="quiet" data-decision="已拒绝，本次命令未执行">拒绝</button><button class="primary" data-decision="示例审批已允许；原型不会执行命令">允许一次</button></div></div>';}if(state==='error')$('#messages').insertAdjacentHTML('beforeend','<div class="error" role="alert"><h3>本次回复中断</h3><p>连接超时。已收到的内容和输入草稿均已保留。</p><div class="actions"><button class="quiet" data-notice="示例错误：连接超时，尚未收到完整回复">查看详情</button><button class="primary" data-notice="原型未连接模型，不会发起真实重试">重试</button></div></div>');}$('#reader').scrollTop=0;updateJump()}
function updateJump(){$('#jump').classList.toggle('hidden',$('#reader').scrollHeight-$('#reader').clientHeight-$('#reader').scrollTop<64)}
$('#state').onchange=render;$('#width').onchange=()=>{$('#app').style.width=$('#width').value+'px';updateJump()};$('#theme').onclick=()=>$('#app').classList.toggle('light');$('#more').onclick=()=>$('#menu').classList.toggle('hidden');$('#new').onclick=()=>{$('#state').value='empty';render()};$('#history').onclick=()=>notify('会话历史入口：正式版本将展示可搜索的会话列表');$('#remove').onclick=()=>$('#chips').replaceChildren();$('#attach').onclick=()=>notify('附件入口：文件、图片和编辑器选区');$('#reader').onscroll=updateJump;$('#jump').onclick=()=>$('#reader').scrollTop=$('#reader').scrollHeight;
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.notice)notify(b.dataset.notice);if(b.dataset.decision){b.closest('.approval').textContent=b.dataset.decision;return}if(b.hasAttribute('data-copy')||b.hasAttribute('data-copy-answer')){const text=b.hasAttribute('data-copy')?b.closest('.codebox').querySelector('code').textContent:$('#messages').innerText;try{await navigator.clipboard.writeText(text);notify('已复制')}catch{notify('浏览器未允许复制，请选择文字后复制')}}if(b.closest('.suggestions')){$('#input').value=b.textContent;$('#input').focus()}});
function send(){const t=$('#input').value.trim();if(!t)return;const p=document.createElement('div');p.className='user';p.textContent=t;$('#messages').append(p);$('#input').value='';$('#input').style.height='74px';$('#reader').scrollTop=$('#reader').scrollHeight;notify('原型已展示消息，未向模型发送')};$('#send').onclick=send;$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('#input').oninput=()=>{$('#input').style.height='74px';$('#input').style.height=Math.min(180,$('#input').scrollHeight)+'px'};render();
</script></html>
