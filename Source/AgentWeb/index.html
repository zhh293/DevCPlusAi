<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'">
<title>AI 助手</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="highlight.css"><link rel="stylesheet" href="layout.css"></head>
<body><header><strong id="chat-title">AI 助手</strong><button id="history" title="历史会话" aria-expanded="false">历史</button><button id="changes" title="查看本次对话的文件改动" aria-haspopup="dialog" aria-controls="changes-panel" aria-expanded="false" hidden>改动 <span id="changes-count" class="change-badge"></span></button><button data-action="new" title="新建会话">＋</button><button id="more" title="更多操作" aria-expanded="false">···</button></header>
<section id="history-panel" class="popup" hidden><label>历史会话<input id="session-search" type="search" placeholder="搜索会话标题" autocomplete="off"></label><div id="sessions" aria-label="历史会话"></div></section>
<section id="changes-panel" class="popup changes-panel" role="dialog" aria-label="本次对话改动" hidden><div class="changes-heading"><strong id="changes-summary">暂无文件改动</strong><button id="changes-close" type="button" aria-label="关闭改动列表">×</button></div><p id="changes-note">改动按文件汇总；选择文件可跳到对话中的差异。</p><div id="change-list"></div></section>
<section id="menu" class="popup" hidden><button data-action="settings">设置与审批模式</button><button data-action="copy">复制最近回复</button><button data-action="open-code">打开回复中的代码</button><button data-action="diagnostics">复制界面诊断</button><button data-action="logs">切换诊断日志</button><button data-action="clear">清空当前对话</button><label>代码操作<select id="quick"><option value="">选择操作…</option><option value="0">解释代码</option><option value="1">修复代码</option><option value="2">优化代码</option><option value="3">添加注释</option><option value="4">诊断编译错误</option><option value="5">学习模式：逐步讲解</option></select></label></section>
<section id="permission-menu" class="permission-menu" role="dialog" aria-label="运行方式" hidden><h3>运行方式</h3><p id="permission-mode-feedback" role="status">切换会重启 Agent CLI，并尝试续接当前会话。</p><button type="button" data-permission-mode="plan"><strong>规划模式</strong><small>读取代码并制定计划，不编辑源文件</small></button><button type="button" data-permission-mode="manual"><strong>逐次审批</strong><small>执行敏感操作前先请求你的确认</small></button><button type="button" data-permission-mode="acceptEdits"><strong>自动编辑</strong><small>允许编辑文件；命令仍受 CLI 权限规则控制</small></button><button type="button" data-action="settings">更多权限设置…</button></section>
<main id="reader" aria-label="对话"><section id="empty"><h2>一起完成下一段代码</h2><p>选中代码后提问，或使用输入框上方的快捷操作。</p></section><div id="messages"></div></main><button id="jump" hidden>↓ 最新消息</button><button id="ask-selection" class="selection-followup" type="button" aria-label="追问选中的 AI 内容" title="将引用加入草稿，不会自动发送" hidden>追问这段</button>
<footer><div class="composer"><div id="attachments"></div><nav id="quick-actions" class="quick-actions" aria-label="常用代码操作"><button type="button" data-quick="0" title="解释当前选区；没有选区时解释当前文件" aria-label="解释代码">解释</button><button type="button" data-quick="1" title="检查并修复当前代码" aria-label="修复代码">修复</button><button type="button" data-quick="2" title="改进当前代码的可读性或效率" aria-label="优化代码">优化</button><button type="button" data-quick="3" title="为当前代码补充注释" aria-label="添加注释">注释</button><button type="button" data-quick="4" title="分析最近的编译错误" aria-label="诊断编译错误">诊断</button><button type="button" data-quick="5" title="面向本科生逐步讲解当前代码" aria-label="学习模式">学习</button></nav><div id="context-preview" class="context-preview" aria-live="polite"><div class="context-top"><div class="context-main"><label class="context-toggle" title="控制是否自动附加当前编辑器代码和编译诊断"><input id="context-toggle" type="checkbox" checked> 附加 IDE 上下文</label><button id="context-summary" type="button" disabled aria-expanded="false" aria-controls="context-details" title="上下文摘要"><span id="context-summary-text">发送前会自动获取当前代码上下文</span><span class="context-chevron" aria-hidden="true">▾</span></button></div><button id="context-refresh" type="button" title="刷新当前文件、选区和编译诊断">刷新</button></div><section id="context-details" class="context-details" hidden><div class="context-detail-head"><strong>最近一次采集的附加文本</strong><span id="context-size"></span></div><p id="context-note"></p><pre id="context-content"></pre></section></div><textarea id="input" rows="3" placeholder="描述任务，或询问当前代码…" aria-label="消息输入" aria-describedby="send-hint"></textarea><div class="actions"><button data-action="attach" title="添加文件">＋</button><button data-action="paste-image" title="粘贴剪贴板图片">图片</button><div class="permission-control"><button id="permission-mode" type="button" aria-haspopup="dialog" aria-controls="permission-menu" aria-expanded="false" disabled><span id="permission-mode-label">逐次审批</span><span class="permission-caret" aria-hidden="true">▾</span></button></div><span id="model">deepseek-v4-flash</span><button id="send" disabled>发送</button></div></div><div class="footer-meta"><span id="status" role="status">正在连接 IDE…</span><span id="send-hint">Enter 发送 · Shift+Enter 换行</span></div></footer>
<script src="vendor/marked.umd.js"></script><script src="highlight.js"></script><script src="messages.js"></script><script src="panel.js"></script></body></html>
