<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'">
<title>AI 助手</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="highlight.css"><link rel="stylesheet" href="layout.css"></head>
<body><header><strong id="chat-title">AI 助手</strong><button id="history" title="历史会话" aria-expanded="false">历史</button><button data-action="new" title="新建会话">＋</button><button id="more" title="更多操作" aria-expanded="false">···</button></header>
<section id="history-panel" class="popup" hidden><label>历史会话<input id="session-search" type="search" placeholder="搜索会话标题" autocomplete="off"></label><div id="sessions" aria-label="历史会话"></div></section>
<section id="menu" class="popup" hidden><button data-action="settings">设置与审批模式</button><button data-action="context">更新代码上下文</button><button data-action="copy">复制最近回复</button><button data-action="open-code">打开回复中的代码</button><button data-action="logs">切换诊断日志</button><button data-action="clear">清空当前对话</button><label>代码操作<select id="quick"><option value="">选择操作…</option><option value="0">解释代码</option><option value="1">修复代码</option><option value="2">优化代码</option><option value="3">添加注释</option><option value="4">诊断编译错误</option></select></label></section>
<main id="reader" aria-label="对话"><section id="empty"><h2>一起完成下一段代码</h2><p>选中代码后提问，或描述你希望实现的功能。</p><button data-quick="0">解释选中的代码</button><button data-quick="1">修复当前代码</button><button data-quick="4">分析编译错误</button></section><div id="messages"></div></main><button id="jump" hidden>↓ 最新消息</button>
<footer><div class="composer"><div id="attachments"></div><textarea id="input" rows="3" placeholder="描述任务，或询问当前代码…" aria-label="消息输入" aria-describedby="send-hint"></textarea><div class="actions"><button data-action="attach" title="添加文件">＋</button><button data-action="paste-image" title="粘贴剪贴板图片">图片</button><span id="model">deepseek-v4-flash</span><button id="send" disabled>发送</button></div></div><div class="footer-meta"><span id="status" role="status">正在连接 IDE…</span><span id="send-hint">Enter 发送 · Shift+Enter 换行</span></div></footer>
<script src="vendor/marked.umd.js"></script><script src="highlight.js"></script><script src="messages.js"></script><script src="panel.js"></script></body></html>
